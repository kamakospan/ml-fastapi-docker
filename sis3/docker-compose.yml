# Full ML system: MLflow server -> trainer (logs + registers models) -> FastAPI -> Streamlit
#   docker compose up --build
#   UI:      http://localhost:8501
#   API:     http://localhost:8000/docs
#   MLflow:  http://localhost:5000

x-app: &app
  build: .
  image: ml-mlflow-system:latest

services:
  mlflow:
    <<: *app
    command: >
      mlflow server
      --backend-store-uri sqlite:////mlflow/mlflow.db
      --artifacts-destination /mlflow/artifacts
      --host 0.0.0.0 --port 5000 --workers 1
      --allowed-hosts mlflow,mlflow:5000,localhost,localhost:5000,127.0.0.1,127.0.0.1:5000
    ports:
      - "5000:5000"
    volumes:
      - mlflow-data:/mlflow
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:5000/health')"]
      interval: 5s
      timeout: 5s
      retries: 30

  trainer:
    <<: *app
    command: python -m app.train
    environment:
      MLFLOW_TRACKING_URI: http://mlflow:5000
      TRAIN_ONLY_IF_EMPTY: "1"
    depends_on:
      mlflow:
        condition: service_healthy
    restart: "no"

  api:
    <<: *app
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000
    environment:
      MLFLOW_TRACKING_URI: http://mlflow:5000
      MLFLOW_RETRIES: "20"
    ports:
      - "8000:8000"
    depends_on:
      trainer:
        condition: service_completed_successfully

  ui:
    <<: *app
    command: streamlit run ui/app.py --server.port 8501 --server.address 0.0.0.0 --server.headless true
    environment:
      API_URL: http://api:8000
      API_PUBLIC_URL: http://localhost:8000
      MLFLOW_UI_URL: http://localhost:5000
    ports:
      - "8501:8501"
    depends_on:
      - api

volumes:
  mlflow-data:
